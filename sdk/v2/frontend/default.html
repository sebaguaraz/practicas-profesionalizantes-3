<script>

	class FormRegisterUser extends HTMLElement {

		constructor() {

			super();
			this.h3 = document.createElement("h3");
			this.form = document.createElement("form");
			this.label_username = document.createElement("label");
			this.label_password = document.createElement("label");
			this.input_username = document.createElement("input");
			this.input_password = document.createElement("input");
			this.br1 = document.createElement("br");
			this.br2 = document.createElement("br");
			this.bttn_createUser = document.createElement("button");

			this.h3.textContent = "Registro de Usuario ";
			this.label_username.textContent = "Usuario: ";
			this.label_username.htmlFor = "username"
			this.input_username.type = "text";
			this.input_username.id = "username";
			this.input_username.name = "username"

			this.label_password.textContent = "Password: ";
			this.label_password.htmlFor = "password"

			this.input_password.type = "password";
			this.input_password.id = "password"
			this.input_password.name = "password"

			this.bttn_createUser.textContent = "Registrarse"
			this.bttn_createUser.type = "submit"

			this.appendChild(this.h3);
			this.form.appendChild(this.label_username)
			this.form.appendChild(this.input_username)
			this.form.appendChild(this.br1)
			this.form.appendChild(this.label_password)
			this.form.appendChild(this.input_password)
			this.form.appendChild(this.br2)
			this.form.appendChild(this.bttn_createUser)

			this.appendChild(this.form)

		}

		async getDataForm(event) {

			event.preventDefault();

			//recibe un form y devuelve un objeto FormData que se llena con los campos name de los <input>
			const formData = new FormData(this.form)

			//uso el metodo FROMENTRIES() de OBJECT, recibe una lista de pares [clave, valor] y devuelve un objeto {clave: valor}.
			const data = Object.fromEntries(formData)

			await this.sendFromServer(data)


		}

		async sendFromServer(data) {

			const config = {
				method: "POST",
				headers: { "Content-type": "application/json" },
				body: JSON.stringify(data)

			}

			try {

				//envia los datos dentro del body en la peticion, el metodo y el formato del cuerpo body
				// devuelve una respuesta del servidor, con propiedades y metodos
				const response = await fetch('http://localhost:3000/register', config);
				console.log(response)

				//el metodo json transforma 
				const result = await response.json()

				if (!response.ok) {
					throw new Error(result.message)
					return
				}

				alert(`usuario ${result.username} con ID ${result.id} registrado con exito a la base de datos!!!`)
				return;


			} catch (error) {

				alert(error.message)
			}

		}


		connectedCallback() {

			this.form.onsubmit = this.getDataForm.bind(this)
		}



		disconnectCallback() {
			this.form.onsubmit = null;
		}




	}

	class FormGetAllUser extends HTMLElement {


		constructor() {

			super();
			this.h3 = document.createElement("h3");
			this.bttn_createUser = document.createElement("button");
			this.table = document.createElement("table")
			this.thead = document.createElement('thead');
			this.tbody = document.createElement('tbody');


			this.h3.textContent = "Obtener Usuarios ";

			this.bttn_createUser.textContent = "Obtener Usuarios"
			this.bttn_createUser.type = "submit"

			this.appendChild(this.h3);

			this.appendChild(this.bttn_createUser)

		}

		async sendFromServer() {
			// un objeto de configuracion de la peticion, el tipo de accion q haces (metodo)
			const config = {
				method: "GET"

			}

			try {

				// Envía la petición al servidor y devuelve un objeto (response) con el estado de la peticion (200-true o 400-false) y metodos para acceder al contenido.
				const response = await fetch('http://localhost:3000/getUsersAll', config);

				// Lee el cuerpo de la respuesta y lo transforma de formato JSON (texto) a un objeto de JavaScript manipulable.
				const result = await response.json()
				console.log(result)

				if (!response.ok) {
					throw new Error(result.message)
					return
				}

				this.showAllUsers(result.lista)


				return;


			} catch (error) {

				alert(error.message)
			}

		}

		showAllUsers(result) {
			this.tbody.textContent = ""
			result.forEach((elemento) => {
				const fila = document.createElement("tr");
				const celdaID = document.createElement("td");
				celdaID.textContent = elemento.id;
				fila.appendChild(celdaID);


				const celdaName = document.createElement("td");
				celdaName.textContent = elemento.username
				fila.appendChild(celdaName);

				this.tbody.appendChild(fila);
			})

			this.table.appendChild(this.thead);
			this.table.appendChild(this.tbody);

			this.appendChild(this.table);
		}

		connectedCallback() {

			this.bttn_createUser.onclick = this.sendFromServer.bind(this)
		}



		disconnectCallback() {
			this.bttn_createUser.onclick = null;
		}




	}

	class FormGetAllGroup extends HTMLElement {

		constructor() {

			super();
			this.h3 = document.createElement("h3");
			this.bttn_group = document.createElement("button");

			this.table = document.createElement("table")
			this.thead = document.createElement('thead');
			this.tbody = document.createElement('tbody');

			this.h3.textContent = "Obtener Grupos ";

			this.bttn_group.textContent = "Obtener"
			this.bttn_group.type = "submit"

			this.appendChild(this.h3);
			this.appendChild(this.bttn_group)

		}


		async sendFromServer() {

			const config = {
				method: "GET"
			}

			try {


				// Envía la petición al servidor y recibe un objeto (response) con el estado de la operación y el acceso al contenido.
				const response = await fetch(`http://localhost:3000/getGroupAll`, config);

				// Lee el cuerpo de la respuesta y lo transforma de formato JSON (texto) a un objeto de JavaScript manipulable.

					return

				await this.showAllGroups(result.lista)

			} catch (error) {

				alert(error.message)
			}

		}

		async showAllGroups(lista) {

			this.tbody.textContent = ""
			lista.forEach((elemento) => {
				const fila = document.createElement("tr");
				const celdaID = document.createElement("td");

			await this.sendFromServer(data);
		}

		async sendFromServer(data) {
			const config = {
				method: "DELETE",
				headers: { "Content-type": "application/json" },
				body: JSON.stringify(data)
			};

			try {
				const response = await fetch('http://localhost:3000/deleteAccess', config);
				const result = await response.json();
				if (!response.ok) {
					throw new Error(result.message);
				}
				alert(`${result.message}`);
			} catch (error) {
				alert(error.message);
			}
		}

		connectedCallback() {
			this.form.onsubmit = this.getDataForm.bind(this);
		}

		disconnectedCallback() {
			this.form.onsubmit = null;
		}
	}
