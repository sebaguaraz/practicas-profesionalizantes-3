<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<title>Login</title>
</head>

<body>
	<p id="result"></p>

	<h1>Registro de usuario</h1>
	<form id="form-register">
		<label>Usuario:</label>
		<input name="username" required><br>
		<label>Password:</label>
		<input type="password" name="password" required><br>
		<button type="submit">Registrar usuario</button>
	</form>

	<h1>Login de usuarios</h1>
	<form id="form-login">
		<label>Usuario:</label>
		<input name="username" required><br>
		<label>Password:</label>
		<input type="password" name="password" required><br>
		<button type="submit">Logear usuario</button>
	</form>

	<h2>Logout </h2>
	<form id="form-logout">
		<label>Usuario:</label>
		<input name="username" required><br>
		<label>Password:</label>
		<input name="password" type="password" placeholder="###"><br>
		<button type="submit">cerrar sesion</button>
	</form>

	<h2>Acciones</h2>
	<button id="btnGetLog" type="submit">Get Log</button>
	<button id="btnGetHello" type="submit">Get sayHello</button>

</body>

<script>

	const PORT = 3000

	const span = document.getElementById('result');
	const form_login = document.getElementById('form-login');
	const form_register = document.getElementById('form-register');
	const form_logout = document.getElementById('form-logout');

	const btnGetLog = document.getElementById('btnGetLog');
	const btnGetHello = document.getElementById('btnGetHello');

	let sessionExist = null

	// Función para calcular el hash SHA-256 de una cadena
	async function calcularHashSHA256(cadena) {
		// * creo un objeto para convertir la cadena a un formato de bytes
		const encoder = new TextEncoder();
		// * convierto la cadena a un array de bytes
		const data = encoder.encode(cadena);
		// * aplico el algoritmo SHA-256 al array de bytes y obtengo el resultado como un array de bytes
		const hashBuffer = await crypto.subtle.digest('SHA-256', data);
		// * transformo el array de bytes en un array de números
		const hashArray = Array.from(new Uint8Array(hashBuffer));
		// * convierto el array de números en una cadena hexadecimal
		const hashHex = hashArray.map(byte => byte.toString(16).padStart(2, '0')).join('');

		return hashHex;
	}

	async function getDataLogin(event) {
		event.preventDefault()
		const formdata = new FormData(form_login)
		const data = Object.fromEntries(formdata);
		data.password = await calcularHashSHA256(data.password)
		sendDataLogin(data);

	}

	async function sendDataLogin(data) {

		try {
			let object_config = {

				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify(data)
			}

			const response = await fetch(`http://localhost:${PORT}/login`, object_config)

			const result = await response.json()

			if (!response.ok) {

				throw new Error(result.error || result.message)

			}
			span.textContent = result.message
			sessionExist = result.session.name
		} catch (error) {

			result.textContent = error.message
		}


	}



	async function getDataRegister(event) {

		event.preventDefault()
		const formdata = new FormData(form_register)
		const data = Object.fromEntries(formdata)

		data.password = await calcularHashSHA256(data.password)
		sendDataRegister(data)

	}

	async function sendDataRegister(data) {
		try {

			const object_config = {

				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify(data)

			}

			const response = await fetch(`http://localhost:${PORT}/register`, object_config)

			const result = await response.json()

			if (!response.ok) {

				throw new Error(result.error || result.message)

			}

			span.textContent = result.message
			console.log(result)

		} catch (error) {

			result.textContent = error.message
		}

	}

	async function getDataLogout(event) {
		event.preventDefault()
		const formdata = new FormData(form_logout)
		const data = Object.fromEntries(formdata);
		data.password = await calcularHashSHA256(data.password)
		sendDataLogout(data);

	}

	async function sendDataLogout(data) {


		try {
			let object_config = {

				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify(data)

			}
			const response = await fetch(`http://localhost:${PORT}/logout`, object_config)

			const result = await response.json()

			if (!response.ok) {

				throw new Error(result.message)

			}
			span.textContent = result.message
			return
		} catch (error) {
			span.textContent = error.message
		}


	}

	async function getLog_handler(event) {
		event.preventDefault()

		const config = {
			method: "GET"
		}

		try {

			const response = await fetch(`http://localhost:${PORT}/log?username=${sessionExist}`, config)
			const result = await response.json()
			if (!response.ok) {
				throw new Error(result.message || result.error)
			}

			span.textContent = result.message


		} catch (error) {
			console.log(sessionExist)

			span.textContent = error.message
		}
	}


	async function getHello_handler(event) {
		event.preventDefault()

		const config = {
			method: "GET"
		}

		try {
			const response = await fetch(`http://localhost:${PORT}/sayHello?username=${sessionExist}`, config)
			const result = await response.json()
			if (!response.ok) {
				throw new Error(result.message || result.error)
			}
			span.textContent = result.message


		} catch (error) {
			console.log(sessionExist)

			span.textContent = error.message
		}
	}


	function main() {
		form_register.onsubmit = getDataRegister
		form_login.onsubmit = getDataLogin;
		form_logout.onsubmit = getDataLogout;

		btnGetLog.onclick = getLog_handler;
		btnGetHello.onclick = getHello_handler;
	}

	window.onload = main;

</script>

</html>
